[project]
name = "ringlight-overlay"
version = "0.0.1"
description = "Windows transparent overlay app simulating ring/softbox lights on secondary monitors."
requires-python = ">=3.13"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
