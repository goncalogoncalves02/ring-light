name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check
        run: black --check .

      - name: Run tests
        shell: pwsh
        run: |
          # windows-latest occasionally crashes pytest on teardown (exit 1
          # with all tests passing). Retry up to 3 times so an isolated flake
          # does not block a PR; a genuine failure still fails all 3 attempts.
          foreach ($attempt in 1..3) {
            Write-Host "pytest attempt $attempt of 3"
            pytest -q
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "attempt $attempt failed (exit $LASTEXITCODE)"
          }
          exit 1
