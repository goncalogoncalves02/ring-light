name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # required to publish the GitHub Release on tag pushes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm RingLightOverlay.spec

      - name: Report dist size
        shell: pwsh
        run: |
          $sizeMb = [math]::Round(
            (Get-ChildItem -Recurse -Force dist\RingLightOverlay | Measure-Object -Property Length -Sum).Sum / 1MB,
            1
          )
          Write-Host "dist/RingLightOverlay size: $sizeMb MB"
          if ($sizeMb -ge 130) {
            Write-Warning "Size ($sizeMb MB) exceeds the 130 MB target."
          }

      - name: Package artifact
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: Compress-Archive -Path dist\RingLightOverlay -DestinationPath "RingLightOverlay-$env:REF_NAME.zip"

      # On a v* tag push: publish a public GitHub Release with the ZIP attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RingLightOverlay-${{ github.ref_name }}.zip
          generate_release_notes: true

      # On manual dispatch (no tag): keep the ZIP as a 30-day workflow artifact.
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: RingLightOverlay
          path: RingLightOverlay-${{ github.ref_name }}.zip
          retention-days: 30
