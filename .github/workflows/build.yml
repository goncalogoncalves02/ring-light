name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm RingLightOverlay.spec

      - name: Report dist size
        shell: pwsh
        run: |
          $sizeMb = [math]::Round(
            (Get-ChildItem -Recurse -Force dist\RingLightOverlay | Measure-Object -Property Length -Sum).Sum / 1MB,
            1
          )
          Write-Host "dist/RingLightOverlay size: $sizeMb MB"
          if ($sizeMb -ge 130) {
            Write-Warning "Size ($sizeMb MB) exceeds the 130 MB target."
          }

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist\RingLightOverlay -DestinationPath RingLightOverlay.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingLightOverlay
          path: RingLightOverlay.zip
          retention-days: 30
